[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vid-forge"
version = "0.1.0"
description = "Video generation and AI provider orchestration workspace"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "kaggle",
    "six",
    "requests",
    "python-dotenv",
    "jsonschema",
]

[project.scripts]
vid-forge = "vid_forge.cli:main"

[tool.setuptools.packages.find]
include = ["vid_forge*"]
